openapi: 3.1.0
info:
  title: API de torneos y partidos
  description: Cada torneo agrupa partidos. Un partido no existe fuera de un torneo.
  version: 1.0.0

paths:
  /tournaments:
    get:
      summary: Lista todos los torneos
      responses:
        '200':
          description: Lista de torneos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tournament'
    post:
      summary: Crea un torneo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TournamentInput'
      responses:
        '201':
          description: Torneo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'
        '400':
          description: Falta un campo obligatorio (name, sport, start_date o end_date)

  /tournaments/{tournamentId}/matches:
    parameters:
      - name: tournamentId
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Lista los partidos de un torneo
      responses:
        '200':
          description: Lista de partidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Match'
        '404':
          description: El torneo no existe
    post:
      summary: Crea un partido dentro de un torneo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchInput'
      responses:
        '201':
          description: Partido creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        '400':
          description: Falta un campo obligatorio, o home_team y away_team son el mismo equipo
        '404':
          description: El torneo no existe

  /tournaments/{tournamentId}/matches/{matchId}:
    parameters:
      - name: tournamentId
        in: path
        required: true
        schema:
          type: integer
      - name: matchId
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Devuelve un partido
      responses:
        '200':
          description: El partido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        '404':
          description: El torneo o el partido no existen
    delete:
      summary: Borra un partido
      responses:
        '204':
          description: Partido borrado
        '404':
          description: El torneo o el partido no existen

components:
  schemas:
    Tournament:
      type: object
      required: [id, name, sport, start_date, end_date]
      properties:
        id:
          type: integer
        name:
          type: string
        sport:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date

    TournamentInput:
      type: object
      required: [name, sport, start_date, end_date]
      properties:
        name:
          type: string
        sport:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date

    Match:
      type: object
      required: [id, tournament_id, home_team, away_team, date, venue, home_score, away_score, status]
      properties:
        id:
          type: integer
        tournament_id:
          type: integer
        home_team:
          type: string
        away_team:
          type: string
        date:
          type: string
          format: date-time
        venue:
          type: string
        home_score:
          type: integer
          minimum: 0
        away_score:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [scheduled, played, cancelled]

    MatchInput:
      type: object
      required: [home_team, away_team, date, venue, home_score, away_score, status]
      properties:
        home_team:
          type: string
        away_team:
          type: string
        date:
          type: string
          format: date-time
        venue:
          type: string
        home_score:
          type: integer
          minimum: 0
        away_score:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [scheduled, played, cancelled]
